<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHODVICKEZ-MD</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: black;
    }

    /* Background animation: Snow + Fire */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    /* Minimized frame only around input */
    .frame {
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-container {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .input-container input {
      width: 160px;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      outline: none;
      color: #000;
      background-color: #f1f1f1;
      transition: all 0.3s ease;
    }

    .input-container input:focus {
      background-color: #111;
      color: #ff0000;
      box-shadow: 0 0 10px #ff0000;
    }

    .input-container button {
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      background: red;
      color: white;
      border: none;
      transition: all 0.3s ease;
    }

    .input-container button:hover {
      background: darkred;
    }

    /* Please Wait Message */
    #waiting-message {
      display: none;
      color: #ffcc00;
      font-size: 1.1rem;
    }

    /* Typing effect */
    .typing {
      color: #e9e4e4;
      font-size: 1.1rem;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid;
      display: inline-block;
      animation: typing 10s steps(30, end) infinite, blink 0.6s infinite alternate, colorChange 2s infinite;
      animation-timing-function: ease-in-out;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    @keyframes colorChange {
      0% { color: red; }
      25% { color: yellow; }
      50% { color: green; }
      75% { color: blue; }
      100% { color: purple; }
    }

    /* Snow effect */
    @keyframes snowfall {
      from { transform: translateY(-100vh); }
      to { transform: translateY(100vh); }
    }

    .snowflake {
      position: absolute;
      top: -10px;
      color: white;
      font-size: 10px;
      opacity: 0.8;
      animation: snowfall linear infinite;
    }

    /* Fire effect */
    .fire {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 200px;
      height: 150px;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.7), transparent);
      border-radius: 50%;
      filter: blur(40px);
      animation: flicker 0.2s infinite alternate;
      transform: translateX(-50%);
    }

    @keyframes flicker {
      from { opacity: 0.6; transform: scale(1); }
      to { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <!-- Background Effects -->
  <div class="background"></div>

  <!-- Typing Effect -->
  <p class="typing">RHODVICKEZ-MD PAIR SITE GET YOUR SESSION ID AND DEPLOY YOUR BOY</p>

  <!-- Minimized Frame -->
  <div class="frame">
    <div class="input-container">
      <input placeholder="254760XXXX" type="number" id="number">
      <button id="submit">Submit</button>
    </div>
    <a id="waiting-message">Please wait a while...</a>
  </div>
  
  <main id="pair"></main>
  </div>

  <!-- Fire effect -->
  <div class="fire"></div>

  <!-- Audio -->
  <audio id="background-audio" loop>
    <source src="https://files.catbox.moe/l7e2ni.mp3" type="audio/mp3">
  </audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let a = document.getElementById("waiting-message");
    let b = document.getElementById("submit");
    let c = document.getElementById("number");

    b.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!c.value) {
        a.innerText = "Enter your WhatsApp number with Country Code";
        a.style.color = "white";
        a.style.display = "block";
      } else if (c.value.replace(/[^0-9]/g, "").length < 11) {
        a.innerText = "Invalid Number";
        a.style.color = "red";
        a.style.display = "block";
      } else {
        a.innerText = "Please Wait...";
        a.style.color = "#ffcc00";
        a.style.display = "block";

        const Wasi_Tech = c.value.replace(/[^0-9]/g, "");
        let { data } = await axios(`/code?number=${Wasi_Tech}`);
        let code = data.code || "Service Unavailable";
        a.innerText = "CODE: " + code;
        a.style.color = "white";
      }
    });

    // Auto-play audio when on site, stop when leaving
    let audio = document.getElementById("background-audio");

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        audio.pause();
      } else {
        audio.play();
      }
    });

    // Create snowfall effect
    function createSnowflakes() {
      const snowflakeCount = 50;
      for (let i = 0; i < snowflakeCount; i++) {
        let snowflake = document.createElement("div");
        snowflake.innerHTML = "🎃";
        snowflake.innerHTML = "🔥";
        snowflake.innerHTML = "💡";
        snowflake.innerHTML = "😂";
        snowflake.classList.add("snowflake");
        snowflake.style.left = `${Math.random() * 100}vw`;
        snowflake.style.animationDuration = `${Math.random() * 5 + 3}s`;
        snowflake.style.fontSize = `${Math.random() * 10 + 10}px`;
        document.querySelector(".background").appendChild(snowflake);
      }
    }

    createSnowflakes();
  </script>

</body>
</html>
